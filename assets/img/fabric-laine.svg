<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="presentation">
  <defs>
    <filter id="laine-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
    <pattern id="laine-twill" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M0 0v8" stroke="#66755e" stroke-width="2.6" opacity="0.35"/>
      <path d="M4 0v8" stroke="#9aa78f" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <radialGradient id="laine-light" cx="28%" cy="18%" r="90%">
      <stop offset="0" stop-color="#aeb99f" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7d8b72" stop-opacity="0"/>
      <stop offset="1" stop-color="#4e5c4a" stop-opacity="0.4"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#7d8b72"/>
  <rect width="600" height="600" fill="url(#laine-twill)"/>
  <rect width="600" height="600" fill="url(#laine-light)"/>
  <rect width="600" height="600" filter="url(#laine-grain)" opacity="0.65"/>
</svg>
